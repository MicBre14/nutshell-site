<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nutshell by pejlar</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f6fa; --text: #1f2430; --muted: #6b7385; --accent: #4046cd; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14171d; --text: #e8ebf1; --muted: #949bab; --accent: #8f9bff; } }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 48px 20px; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      p { color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-512.png" alt="" />
      <h1>Nutshell</h1>
      <p>Puzzle and arcade games by pejlar – no ads, ever.</p>
      <p><a href="privacy-policy.html">Privacy policy</a> · <a href="mailto:support@pejlar.se">support@pejlar.se</a></p>
    </main>
  </body>
</html>
